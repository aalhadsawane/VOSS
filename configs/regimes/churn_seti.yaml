# Traced host availability (docs/REVISION_PLAN.md V9.2): every worker replays one SETI@home host's week of availability
# intervals (Failure Trace Archive, seti09; tools/traces/fta.py). Correlated losses are in the trace, so there is no
# synthetic shock or tier model (checklist 2.9). Whether a session ends with notice is not in the data: graceful_frac
# is an axis (A: {0, 0.5}).
provenance: {default: trace, note: "sessions from configs/traces/seti09/provenance.yaml"}
regime: churn_seti
trace: seti09
split: dev
graceful_frac: 0.5
drain_lead: {dist: lognormal, median: 120, sigma: 0.7}
