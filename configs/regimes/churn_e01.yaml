# E01 churn: sessions of minutes instead of hours so a ten-minute run sees session ends, drains and re-attestation.
# tag: assumed (a scaled-down copy of churn_med for a short validation scenario, not a claim about volunteers).
provenance: {default: assumed}
regime: churn_e01
graceful_frac: 0.5
drain_lead: {dist: lognormal, median: 20, sigma: 0.5}
tiers:
  nightly: {kind: nightly, start_hour: 22, start_sd_h: 1.0, p_night: 0.9, length: {dist: lognormal, median: 28800, sigma: 0.4}}
  idle: {kind: poisson, rate_per_h: 0.1, peak_h: 14, amplitude: 0.5, length: {dist: weibull, shape: 0.7, scale: 10800}}
  dedicated: {kind: always, length: {dist: weibull, shape: 0.8, scale: 400}, gap: {dist: lognormal, median: 60, sigma: 0.5}}
shocks: {rate_per_h: 0.0, frac: 0.3, scope: city}
platform: {late_join_frac: 0.0, leave_rate_per_day: {nightly: 0.0, idle: 0.0, dedicated: 0.0}}
