# D02_FORGE: owners who forge results (docs/REVISION_PLAN.md V11.2; grid of R05 in V12.2). DEVELOPMENT SPLIT, NOT A
# REPORTED RESULT: for iterating on the sampled audit (V11.3); never appears in the paper (guardrail 31). The claim
# it informs is for owner class P only (guardrail 24): only class-P owners can forge (plan V7.3).
#
# Header (AGENTS.md rule 21):
#   workers      500 (D-97)
#   load         Azure Functions 2019, development split, scenario.load.rate_mult 21 (D01's central level)
#   utilisation  pool about 0.5% at rate_mult 21 (D01 header, D-99)
#   duration     horizon_s 100,800 (28 h): 4 h warm-up + 24 h measured (D-97)
#   warm-up      scenario.warmup_s 14,400 (the longest learning window of a compared policy: the histogram's 4 h)
#   calibration  provisional measured bundle i7_12700_64g_full-b4f89a4def (as D01)
#   trace split  development: load azure2019 dev, sessions churn_seti dev, links ookla-fixed-2024q1, populations wup2025
#   seeds        1 (first stage; 3 seeds after the plumbing is exercised)
#   K            voss.keys.max_holders 8 (D01's central K)
# Grid: class-P share scenario.physical_frac in {0.05, 0.2} (plan R05: 5, 20%), every class-P owner forging
#   (alpha 1 with a forge-only mix: forgers are drawn from class-P owners only, so all of them forge) x forge
#   probability params.forge_p in {0.5, 1.0} (0.5 is the model default, tag assumed; 1.0 forges every result) x audit
#   rate voss.audit.p in {0, 0.01, 0.05} (plan R05: 0, 1, 5%). One system: VOSS (the audit is its mechanism; the
#   baselines have no audit).
# Runs: 2 x 2 x 3 x 1 seed = 12, one per shard (each the D01a size).
experiment: D02_FORGE
base: ../machines.yaml  # calibrated fleet: node02 NVMe and HDD, node04 (D-107, D-108)
overrides:
  - horizon_s=100800
  - scenario.warmup_s=14400
  - scenario.workers=500
  - scenario.regime=churn_seti
  - scenario.load.trace=azure2019
  - scenario.load.split=dev
  - scenario.network.link.trace=ookla-fixed-2024q1
  - scenario.geo.pop_trace=wup2025
  - voss.keys.max_holders=8
  - scenario.load.rate_mult=21
  - "scenario.adversary={regime: adversary_all, alpha: 1.0, mix: {forge: 1.0}}"
grid:
  scenario.physical_frac: [0.05, 0.2]
  scenario.adversary.params.forge_p: [0.5, 1.0]
  voss.audit.p: [0.0, 0.01, 0.05]
systems:
  voss: [voss.planner.name=hetero, voss.detection.detector=voss]
seeds: [1, 2, 3]  # the owner accepted 3 seeds for development; one run cannot rank systems (development log iteration 3)
