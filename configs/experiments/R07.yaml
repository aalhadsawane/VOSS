  m_base_hi: [voss.planner.name=hetero, voss.worker.m_base_mb=1024.0, voss.planner.params.m_base_mb=1024.0]
  cpu_frac_lo: [voss.planner.name=hetero, scenario.envelope.cpu_frac=0.5]
