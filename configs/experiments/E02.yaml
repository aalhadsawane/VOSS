# E02 pilot (doc 06 §5, RQ9): planning-pool size (cluster size proxy until P5) × T_plan × solver time × latency.
# Measured decision clock: solver wall time enters simulated time (doc 01 §7).
experiment: E02
base: ../smoke.yaml
overrides:
  - horizon_s=900
  - scenario.workers=300
  - scenario.load.rate=10
  - voss.planner.name=milp
  - decision_clock.mode=measured
grid:
  voss.planner.max_plan_workers: [10, 20, 40, 80]
  voss.planner.T_plan: [15, 60]
# pilot, not part of `make paper` (D-63): the measured decision clock needs the machine to itself (~7 min a run)
seeds: [1, 2, 3, 4, 5]
report:
  keys: [voss.planner.T_plan, voss.planner.max_plan_workers]
  metrics: [success, met, p50_sync, p99_sync, exposure, waste, warm_mb]
