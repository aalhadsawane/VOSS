# D01a: stage 1 of D01 (docs/REVISION_PLAN.md V11.1). DEVELOPMENT SPLIT, NOT A REPORTED RESULT. The central cell of
# D01 (K = 8, the middle load level rate_mult 21, measured pool utilisation about 0.5%; the plan's "60%" cell, see the
# D01 header for why 60% of the pool is not reachable), every D01 system, seed 1: 9 runs, one per shard. Everything
# else (workers 500, 4 h warm-up + 24 h measured, bundle i7_12700_64g_full-b4f89a4def, development split of every
# trace, exact_program left out) is D01's; the overrides and systems are copied unchanged, so these runs have the same
# config hashes as the matching D01 runs.
experiment: D01a
base: ../machines.yaml  # calibrated fleet: node02 NVMe and HDD, node04 (D-107, D-108)
overrides:
  - horizon_s=100800
  - scenario.warmup_s=14400
  - scenario.workers=500
  - scenario.regime=churn_seti
  - scenario.load.trace=azure2019
  - scenario.load.split=dev
  - scenario.network.link.trace=ookla-fixed-2024q1
  - scenario.geo.pop_trace=wup2025
grid:
  voss.keys.max_holders: [8]
  scenario.load.rate_mult: [21]
systems:
  voss: [voss.planner.name=hetero]
  on_demand: [voss.planner.name=none, voss.worker.warm_ttl_s=0]
  fixed_keepalive: [voss.planner.name=keepalive_ttl]
  hybrid_histogram: [voss.planner.name=histogram_prewarm]
  prereleased_keys: [voss.planner.name=provisioned_keys]
  eviction_aware: [voss.planner.name=keepalive_ttl, voss.placer.sync=eviction_aware, voss.placer.async=eviction_aware]
  kpa: [voss.planner.name=kpa, voss.planner.T_plan=2]
  greedy_dual: [voss.planner.name=keepalive_ttl, voss.worker.warm_eviction=greedy_dual, voss.worker.warm_ttl_s=1e9]
  trusted_hosts: [system=reference_cloud, voss.planner.name=hetero]
left_out: [exact_program]  # see the D01 header
seeds: [1]
