# D02_DROP: owners who drop work (docs/REVISION_PLAN.md V11.2; grid of R04 in V12.2). DEVELOPMENT SPLIT, NOT A
# REPORTED RESULT: for iterating on failure handling (V11.3); never appears in the paper (guardrail 31).
#
# Header (AGENTS.md rule 21):
#   workers      500 (D-97)
#   load         Azure Functions 2019, development split, scenario.load.rate_mult 21 (D01's central level)
#   utilisation  pool about 0.5% at rate_mult 21 (D01 header, D-99); per function: summary column fn_util_* once the
#                per-function metric is merged
#   duration     horizon_s 100,800 (28 h): 4 h warm-up + 24 h measured (D-97)
#   warm-up      scenario.warmup_s 14,400 (the longest learning window of a compared policy: the histogram's 4 h)
#   calibration  provisional measured bundle i7_12700_64g_full-b4f89a4def (as D01)
#   trace split  development: load azure2019 dev, sessions churn_seti dev, links ookla-fixed-2024q1, populations wup2025
#   seeds        1 (first stage; the owner accepted 3 seeds for development, added after the plumbing is exercised)
#   K            voss.keys.max_holders 8 (D01's central K)
# Grid: dropping owners scenario.adversary.alpha in {0, 0.1, 0.2} of the pool (plan R04: 0, 10, 20%), behaviours of
#   regime adversary_mixed (black hole 0.4, on/off 0.4, random omission 0.2; tag assumed) x every failure-handling
#   system of configs/baselines.yaml, each with VOSS provisioning (hetero). alpha 0 is the no-adversary control.
# Runs: 4 systems x 3 levels x 1 seed = 12, one per shard (each the D01a size).
experiment: D02_DROP
base: ../machines.yaml  # calibrated fleet: node02 NVMe and HDD, node04 (D-107, D-108)
overrides:
  - horizon_s=100800
  - scenario.warmup_s=14400
  - scenario.workers=500
  - scenario.regime=churn_seti
  - scenario.load.trace=azure2019
  - scenario.load.split=dev
  - scenario.network.link.trace=ookla-fixed-2024q1
  - scenario.geo.pop_trace=wup2025
  - voss.keys.max_holders=8
  - scenario.load.rate_mult=21
  - voss.planner.name=hetero
  - scenario.adversary.regime=adversary_mixed
grid:
  scenario.adversary.alpha: [0.0, 0.1, 0.2]
systems:
  voss: [voss.detection.detector=voss]
  fixed_timeout: [voss.detection.detector=fixed]
  consecutive_ejection: [voss.detection.detector=consecutive]
  hedged: [voss.detection.detector=hedged]
seeds: [1, 2, 3]  # the owner accepted 3 seeds for development; one run cannot rank systems (development log iteration 3)
