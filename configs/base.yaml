# Full default config (doc 05 §6). World sections are validated by the world models that own them.
# The calibrated fleet is the base (D-107, D-130; checklist 1.2): every run uses the measured machine classes below.
seed: 1
horizon_s: 3600
system: voss
scenario:
  workers: 1000
  start_utc_h: 0
  warmup_s: 172800
  substrate_mix: {appliance_tpm: 1.0}
  tiers: {nightly: 0.6, idle: 0.3, dedicated: 0.1}
  machines:
    bundles: [node02-i7-12700-64g-nvme_nvme, node02-i7-12700-64g-nvme_hdd, node04-i7-4790s-8g-hdd_hdd]
    survey: boinc-rosetta
  regime: churn_med
  adversary: {regime: adversary_none}
  load: {regime: load_default, rate: 100}
  functions: functions.yaml
  tenants: tenants.yaml
decision_clock: {mode: modeled, coeffs_file: calibration/provider/intel-xeon-6975p-c/decision.yaml}  # measured, plan V10
calibration: configs/calibration/measured/node02-i7-12700-64g-nvme_nvme  # reference machine of the fleet (D-107)
