# Function catalogue (doc 02 §8), modeled on SeBS benchmarks. work_ref_s and init_s are seeds only: every reported
# run overrides them per machine class from the calibration bundle (D-107). mem_mb is the guest memory the image gives
# each Firecracker sandbox (A, a stated build parameter, D-119). The deadline multiple and the idempotent fraction are
# scenario keys (scenario.deadline_multiple, scenario.idempotent_frac, D-119), not catalogue fields.
provenance: {default: literature, source: "SeBS (Copik et al., Middleware'21) reported ranges", note: "run times are replaced by each class's measured values (D-107); mem_mb stated (D-119)"}
functions:
  - {name: dynamic-html,      tenant: t-web,    runtime: python3, rootfs_mb: 120, bundle_mb: 1,   snapshot_mb: 64,  mem_mb: 128,  init_s: 0.15, work_ref_s: 0.005, in_kb: 1,    size_exp: 0.1, out_kb: 50,   slo_class: sync}
  - {name: uploader,          tenant: t-media,  runtime: python3, rootfs_mb: 120, bundle_mb: 2,   snapshot_mb: 64,  mem_mb: 128,  init_s: 0.2,  work_ref_s: 0.2,   in_kb: 1,    size_exp: 0.0, out_kb: 1,    slo_class: async}
  - {name: thumbnailer,       tenant: t-media,  runtime: python3, rootfs_mb: 140, bundle_mb: 8,   snapshot_mb: 96,  mem_mb: 256,  init_s: 0.3,  work_ref_s: 0.15,  in_kb: 200,  size_exp: 0.7, out_kb: 20,   slo_class: sync}
  - {name: video-processing,  tenant: t-media,  runtime: python3, rootfs_mb: 200, bundle_mb: 60,  snapshot_mb: 300, mem_mb: 512,  init_s: 0.5,  work_ref_s: 3.0,   in_kb: 5000, size_exp: 0.9, out_kb: 2000, slo_class: async}
