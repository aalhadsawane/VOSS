# E01 on the bare-metal host `i7-12700-64g` (docs/validation/E01-i7-12700-64g.md). Same scenarios as the lab-node
# run, with this machine's own measured bundle and a worker class cut from it.
#
# Worker count: 12 slices. One slice is 3 cores / 4 GB (class E1), so 12 slices model 36 cores and 48 GB of the host's
# 20 hardware threads and 64 GB. 16 slices (the lab-node count) would claim 64 GB of model capacity on a 64 GB machine
# and leave no room for the page cache that snapshots live in; 12 also keeps at most 24 concurrent microVMs (2 slots
# per slice) on the 16 P-core threads, the same oversubscription the lab-node run used.
extends: ../base.yaml
calibration: configs/calibration/measured/i7_12700_64g-b4f89a4def
scenario:
  workers: 12
  hw_mix: {E1: 1.0}
