# V13 emulation worker (plan V13, handoff Part E): one physical P-core of node02, two SMT threads, two concurrency
# slots.
#
# `cores: 3` is the model's capacity unit that yields two slots under the default 75% envelope (D-132). The physical
# slice is one P-core and its two hardware threads: tools/emu/isolation.py pins the worker's sandboxes to them and no
# other worker ever shares the core. `mem_gb: 4` is the donated memory of the slice (D-132); the emulator's cgroup limit
# (`emu.mem_mb_per_worker` in the scenario) is larger, because it also holds the snapshot files and page cache of the
# worker's process tree, while the model admits invocations against the donated share only.
#
# COMPAT: the freeze cleanup deletes configs/hardware/ (FREEZE_CHECKLIST 1.1) and makes the calibrated fleet the only
# path (1.2). After that PR, delete this file and replace `scenario.hw_mix: {E2: 1.0}` in configs/emu/s1_central.yaml
# with `scenario.machines: {bundles: [node02-i7-12700-64g-nvme_nvme], survey: boinc-rosetta}`; the fleet class of that
# bundle is node02 itself (two slots), so the emulated slice keeps its meaning.
