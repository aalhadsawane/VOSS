# V13 emulation scenario (docs/REVISION_PLAN.md V13; docs/handoff/CALIBRATION_HANDOFF.md Part E).
#
# ONE file for both sides. `tools.emu.run --system S --rep i` runs it in emulation on the node; `--emit-sim-spec`
# writes the `experiments.runner` spec that runs the same systems, overrides and seeds in the simulator, so the two
# sides have the same scenario hash and `tools.emu.compare` can pair them run for run.
#
# Header (AGENTS.md rule 21):
#   workers      6 emulated workers (handoff Part E: 6-10), one physical P-core each; node02 has 8 P-cores, so the
#                provider roles (scheduler, routers, verifier, key services, the coordinator) get the other two.
#   load         synthetic arrivals at 20 invocations/s over the five guest-runnable functions. The emulator serves
#                this in real time because node02's measured handler times are 25 us to 0.17 s (bundle below), and
#                the simulator puts it near 15-20% slot utilisation: a timing validation, not the R01 operating
#                point (docs/validation/emulation-runbook.md §3).
#   utilisation  measured and reported, not fixed here
#   duration     horizon_s 7200 (2 h) + 120 s drain
#   warm-up      scenario.warmup_s 600: the session traces start 10 min before t=0, arrivals at t=0; the report's
#                metrics count invocations from 600 s
#   sessions     seti09 dev split (FTA, V9.2): six hosts replay their own week of availability, which is the only
#                session model since the freeze (checklist 2.9 deleted the synthetic tiers)
#   calibration  configs/calibration/measured/node02-i7-12700-64g-nvme_nvme (measured only, guardrail 28)
#   fleet        one class: node02 itself, so every emulated worker is a slice of this machine. The survey only
#                weights classes; with one class it has no effect on the run (D-107).
#   trace split  dev. This is a simulator check, not a reported result (guardrail 31: results use the held-out split).
#   seeds        1, 2, 3 (the three repetitions the handoff asks for)
#   K            unset: each tenant's own budget, so the two systems differ only in provisioning
#
# The systems are the two the handoff names: VOSS's own provisioning (`hetero`) and the fixed keep-alive timer
# (`keepalive_ttl`, Shahrad et al. ATC 2020, 10 minutes), both with the same capacity, timeouts and holder budget
# (guardrails 16, 17).
#
# Requires the traced inputs of `configs/base.yaml` on the node: data/traces/boinc-rosetta (the fleet survey) and
# data/traces/ookla-fixed-2024q1 (the worker links the injected delay and bandwidth are taken from). Sessions come
# from data/traces/seti09/sessions_dev.parquet. The runbook lists them; `--dry-run` reports the first missing file.
provenance: {default: assumed, note: "validation scenario for the simulator, not a reported result: the slice size, load and repetition count are chosen so one node can run it, not measured from volunteers"}
name: s1_central
description: 2 h, 6 emulated workers, VOSS against the fixed keep-alive timer (plan V13, handoff Part E)
config: ../base.yaml
overrides:
  - horizon_s=7200
  - drain_s=120
  - scenario.workers=6
  - scenario.warmup_s=600
  - scenario.start_utc_h=12
  - "scenario.machines={bundles: [node02-i7-12700-64g-nvme_nvme], survey: boinc-rosetta}"
  - "scenario.geo={regions: [eu]}"
  - scenario.functions=emu/functions.yaml
  - scenario.tenants=emu/tenants.yaml
  - "scenario.load={trace: '', rate: 20, zipf_s: 1.0, mmpp: {enabled: true, burst_mult: 4.0, mean_normal_s: 120, mean_burst_s: 60}}"
  - voss.planner.name=hetero
  - voss.cache.hdd_tier=false
systems:
  voss: [voss.planner.name=hetero]
  fixed_keepalive: [voss.planner.name=keepalive_ttl]
seeds: [1, 2, 3]
emu:
  workers: 6
  kind: P
  cores_per_worker: 1
  infra_cores: 2
  mem_mb_per_worker: 4096
  assets: ~/voss-calib/assets
  rootfs: voss-guest.ext4
  workdir: /var/tmp/voss-emu
  tpm: true
