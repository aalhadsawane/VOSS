# Functions of the V13 emulation scenario (plan V13, handoff Part E).
#
# The guest image runs the Python functions of tools/calibrate/guest/functions/; the nodejs entries and the functions
# whose guest cannot build its own input (video-processing) are left out, as the retired E01 subset did. These are seeds
# only: every run replaces run time, start-up and size exponent with the measured values of its machine class (D-107),
# and node02's bundle is the class this scenario names. The deadline multiple and the idempotent fraction are scenario
# keys (`scenario.deadline_multiple`, `scenario.idempotent_frac`), not catalogue fields (D-119).
provenance: {default: literature, source: "SeBS (Copik et al., Middleware'21) reported ranges", note: "run times are replaced by the class's measured values (D-107)"}
functions:
  - {name: dynamic-html,   tenant: t-web,   runtime: python3, rootfs_mb: 120, bundle_mb: 1,  snapshot_mb: 64,  mem_mb: 128, init_s: 0.15, work_ref_s: 0.005, in_kb: 1,    size_exp: 0.1, out_kb: 50,  slo_class: sync}
  - {name: uploader,       tenant: t-media, runtime: python3, rootfs_mb: 120, bundle_mb: 2,  snapshot_mb: 64,  mem_mb: 128, init_s: 0.2,  work_ref_s: 0.2,   in_kb: 1,    size_exp: 0.0, out_kb: 1,   slo_class: async}
  - {name: thumbnailer,    tenant: t-media, runtime: python3, rootfs_mb: 140, bundle_mb: 8,  snapshot_mb: 96,  mem_mb: 256, init_s: 0.3,  work_ref_s: 0.15,  in_kb: 200,  size_exp: 0.7, out_kb: 20,  slo_class: sync}
  - {name: compression,    tenant: t-data,  runtime: python3, rootfs_mb: 120, bundle_mb: 2,  snapshot_mb: 128, mem_mb: 256, init_s: 0.2,  work_ref_s: 1.5,   in_kb: 2000, size_exp: 0.8, out_kb: 800, slo_class: async}
  - {name: graph-pagerank, tenant: t-graph, runtime: python3, rootfs_mb: 160, bundle_mb: 15, snapshot_mb: 256, mem_mb: 512, init_s: 0.6,  work_ref_s: 0.5,   in_kb: 1,    size_exp: 0.0, out_kb: 10,  slo_class: sync}
