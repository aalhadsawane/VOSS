# Functions of the V13 emulation scenario (plan V13, handoff Part E).
#
# The guest image runs the Python functions of tools/calibrate/guest/functions/; the nodejs catalogue entries and
# video-processing (whose guest builds a 5 MB video as input) are left out, as the E01 subset did. The measured
# profiles of node02's bundle replace these seeds when the scenario names that bundle (rule 13); the seeds below are
# only what a run without a measured bundle would use.
provenance: {default: literature, source: "SeBS (Copik et al., Middleware'21) reported ranges; sizes assumed"}
functions:
  - {name: dynamic-html,   tenant: t-web,   runtime: python3, rootfs_mb: 120, bundle_mb: 1,  snapshot_mb: 64,  mem_mb: 128, init_s: 0.15, work_ref_s: 0.005, in_kb: 1,    in_sigma: 0.3, size_exp: 0.1, out_kb: 50,  idempotent: true, slo_class: sync,  slo_k: 5}
  - {name: uploader,       tenant: t-media, runtime: python3, rootfs_mb: 120, bundle_mb: 2,  snapshot_mb: 64,  mem_mb: 128, init_s: 0.2,  work_ref_s: 0.2,   in_kb: 1,    in_sigma: 0.2, size_exp: 0.0, out_kb: 1,   idempotent: true, slo_class: async, slo_k: 10}
  - {name: thumbnailer,    tenant: t-media, runtime: python3, rootfs_mb: 140, bundle_mb: 8,  snapshot_mb: 96,  mem_mb: 256, init_s: 0.3,  work_ref_s: 0.15,  in_kb: 200,  in_sigma: 0.8, size_exp: 0.7, out_kb: 20,  idempotent: true, slo_class: sync,  slo_k: 5}
  - {name: compression,    tenant: t-data,  runtime: python3, rootfs_mb: 120, bundle_mb: 2,  snapshot_mb: 128, mem_mb: 256, init_s: 0.2,  work_ref_s: 1.5,   in_kb: 2000, in_sigma: 0.6, size_exp: 0.8, out_kb: 800, idempotent: true, slo_class: async, slo_k: 10}
  - {name: graph-pagerank, tenant: t-graph, runtime: python3, rootfs_mb: 160, bundle_mb: 15, snapshot_mb: 256, mem_mb: 512, init_s: 0.6,  work_ref_s: 0.5,   in_kb: 1,    in_sigma: 0.2, size_exp: 0.0, out_kb: 10,  idempotent: true, slo_class: sync,  slo_k: 5}
