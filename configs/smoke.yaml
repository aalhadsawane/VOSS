# P2 smoke run (roadmap P2 exit): 1k workers, 1 simulated hour, one cluster. Test configuration only: the fleet's
# survey is a tiny fixture under tests/, so the run needs no fetched trace data (the reported runs use
# configs/base.yaml's survey).
extends: base.yaml
horizon_s: 3600
scenario:
  workers: 1000
  machines:
    bundles: [node02-i7-12700-64g-nvme_nvme, node02-i7-12700-64g-nvme_hdd, node04-i7-4790s-8g-hdd_hdd]
    survey: test
    trace_root: tests/fixtures/fleet
voss:
  placer: {sync: least_loaded}
