[project]
name = "voss"
version = "0.1.0"
description = "VOSS: Volunteer-Oriented Serverless Scheduling (research simulator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
voss = "voss.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voss"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["voss", "tests", "experiments", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "C4", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.seed".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.rand".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.randn".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.randint".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.random".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.choice".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.normal".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.uniform".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.shuffle".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.permutation".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.default_rng".msg = "Use voss.core.rng streams (doc 01 §8)."
"numpy.random.RandomState".msg = "Use voss.core.rng streams (doc 01 §8)."

[tool.ruff.lint.per-file-ignores]
"voss/core/rng.py" = ["TID251"]
"tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["voss", "experiments", "tools"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "matplotlib.*", "grimp.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests"]
