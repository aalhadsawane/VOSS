# Experiment pipeline (docs/REVISION_PLAN.md V6, D-90): request file -> shard matrix -> raw logs in a release ->
# summaries and hashes in a PR into revision-v2. Start a run by committing runs/requests/experiment/<name>.yaml
# ({spec: TOY, shards: 3, note: "..."}) on revision-v2; workflow_dispatch is not offered for non-default branches.
name: experiment
on:
  push:
    branches: [revision-v2]
    paths: ['runs/requests/experiment/*.yaml']
  workflow_dispatch:
    inputs:
      request: {description: 'path of a request file', required: true}
permissions:
  contents: write
  pull-requests: write
env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  NPY_DISABLE_CPU_FEATURES: X86_V4 X86_V3 AVX512_ICL AVX512_SPR
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.req.outputs.spec }}
      shards: ${{ steps.req.outputs.shards }}
      matrix: ${{ steps.req.outputs.matrix }}
      request: ${{ steps.req.outputs.request }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.request }}
        run: |
          if [ -n "$INPUT" ]; then f="$INPUT"; else
            f=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'runs/requests/experiment/*.yaml' | sort | head -1)
          fi
          test -n "$f" && test -f "$f"
          spec=$(python3 -c "import sys,yaml;print(yaml.safe_load(open(sys.argv[1]))['spec'])" "$f")
          n=$(python3 -c "import sys,yaml;print(int(yaml.safe_load(open(sys.argv[1])).get('shards',1)))" "$f")
          test -f "configs/experiments/$spec.yaml"
          echo "request=$f" >> "$GITHUB_OUTPUT"; echo "spec=$spec" >> "$GITHUB_OUTPUT"; echo "shards=$n" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))" "$n")" >> "$GITHUB_OUTPUT"
          echo "request $f: spec=$spec shards=$n"
  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: {shard: '${{ fromJSON(needs.plan.outputs.matrix) }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11"}
      - run: nproc; free -m; lscpu
      - run: uv sync --frozen
      - run: uv run python -m tools.traces.fetch  # published traces into data/traces, hashes checked (plan V9)
        env: {GH_TOKEN: '${{ github.token }}'}
      - run: >-
          uv run python -m experiments.sweep ${{ needs.plan.outputs.spec }}
          --shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --jobs "$(nproc)" --out runs
      # Summaries and hashes are small; collect them where the raw logs are so the publish job never downloads
      # thousands of run directories (a held-out sweep is ~2.7 TB of raw tables).
      - run: >-
          uv run python -m experiments.collect ${{ needs.plan.outputs.spec }} --runs runs
          --dst results/partial-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          {name: 'summary-${{ matrix.shard }}', path: 'results/partial-${{ matrix.shard }}', retention-days: 7}
      # Keep a deterministic raw-log sample (one run from every 100th shard) for the release. The full raw logs are
      # not retained: every run is reproducible from its committed config hash and seed, and the paper reads the
      # committed summary and hash of every run (D-135).
      - if: ${{ matrix.shard == 0 || matrix.shard == 100 || matrix.shard == 200 }}
        run: |
          d=$(find "runs/${{ needs.plan.outputs.spec }}" -mindepth 1 -maxdepth 1 -type d | sort | head -1)
          test -n "$d"
          tar --zstd -cf raw-${{ matrix.shard }}.tar.zst -C "runs/${{ needs.plan.outputs.spec }}" "$(basename "$d")"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.shard == 0 || matrix.shard == 100 || matrix.shard == 200 }}
        with: {name: 'raw-${{ matrix.shard }}', path: 'raw-${{ matrix.shard }}.tar.zst', retention-days: 7}
  publish:
    needs: [plan, sweep]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: runs-${{ needs.plan.outputs.spec }}-${{ github.run_id }}
      DST: results/${{ needs.plan.outputs.spec }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11"}
      - run: uv sync --frozen
      - run: uv run python -m tools.traces.fetch  # published traces into data/traces, hashes checked (plan V9)
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'summary-*', path: partials}
      - uses: actions/download-artifact@v4
        with: {pattern: 'raw-*', merge-multiple: true, path: raw}
      - name: merge the per-shard summaries and hashes
        run: |
          uv run python -m experiments.merge_results --parts partials/summary-* --dst "$DST"
          cp "${{ needs.plan.outputs.request }}" "$DST/request.yaml"
          printf 'release: %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\n' "$TAG" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$DST/provenance.yaml"
      - name: release with the raw-log sample and the summaries
        run: |
          shopt -s nullglob
          files=(raw/*.tar.zst "$DST"/summary.parquet "$DST"/hashes.csv)
          gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" --notes "Summaries and hashes of every run, and a raw-log sample, of ${{ needs.plan.outputs.request }} at $GITHUB_SHA (docs/REVISION_PLAN.md V6)."
      - name: results PR into revision-v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "results/${{ needs.plan.outputs.spec }}-$GITHUB_RUN_ID"
          git add -f "$DST" && git commit -m "Results of ${{ needs.plan.outputs.spec }} (run $GITHUB_RUN_ID)"
          git push origin HEAD
          gh pr create --base revision-v2 --title "Results: ${{ needs.plan.outputs.spec }} run $GITHUB_RUN_ID" \
            --body "Summaries and hashes of release \`$TAG\`, from \`${{ needs.plan.outputs.request }}\`." \
            || echo "::warning::PR not created (Actions may lack permission to open PRs); the branch is pushed"
