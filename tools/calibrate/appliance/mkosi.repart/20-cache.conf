# Worker cache (bundles and snapshots, all ciphertext): LUKS2 with the key sealed to the TPM's PCRs, so the partition
# opens only when the machine booted this image (docs/REVISION_PLAN.md §2, D-85). Its size is a build parameter and is
# reported as image_cache_bytes. The first boot enrols the TPM; the bare-metal session records whether it succeeded.
[Partition]
Type=linux-generic
Label=cache
Format=ext4
Encrypt=tpm2
SizeMinBytes=8G
SizeMaxBytes=8G
