# VOSS appliance image (doc 10 §3.1, doc 04 §4 reference design): UKI + dm-verity root, booted once via a separate
# boot entry, logs reboot-to-attested timestamps, reboots back. DRAFT: validate against the mkosi version on C0
# (record it in the run's meta) before the first `appliance` run, which needs the user's explicit approval.
[Distribution]
Distribution=debian
Release=bookworm

[Output]
ImageId=voss-appliance
Format=disk
SplitArtifacts=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=quiet rd.systemd.show_status=false
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        tpm2-tools
        openssl
        e2fsprogs

[Validation]
Verity=yes
