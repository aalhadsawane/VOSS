# VOSS appliance image (docs/handoff/CALIBRATION_DATA_CONTRACT.md §3, D-85): UKI + dm-verity root (mkosi.repart/) and a
# TPM-sealed LUKS2 cache partition, booted once via a separate boot entry; logs per-step boot stamps and reboots back.
# Not yet built on bare metal: the first build records the mkosi version in the run's meta, and the first boot needs the
# user's explicit approval (AGENTS.md rule 14).
[Distribution]
Distribution=debian
Release=bookworm

[Output]
ImageId=voss-appliance
Format=disk
SplitArtifacts=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=quiet rd.systemd.show_status=false
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        tpm2-tools
        openssl
        e2fsprogs
        cryptsetup

[Validation]
Verity=yes
